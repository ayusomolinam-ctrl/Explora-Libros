<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Libros</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Explora Libros</h1>
      <p>
        Busca libros por título o autor y descubre información sobre tus próximas
        lecturas.
      </p>
    </header>

    <main>
      <section aria-labelledby="search-heading">
        <h2 id="search-heading">Buscar libros</h2>

        <form id="book-search-form" role="search">
          <label for="book-search-input">Título o autor</label>
          <input
            type="search"
            id="book-search-input"
            name="query"
            placeholder="Ejemplo: Don Quijote o Miguel de Cervantes"
            required
          >
          <button type="submit">Buscar</button>
        </form>

        <p id="user-message" role="status" aria-live="polite"></p>
      </section>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Resultados</h2>
        <div id="book-results"></div>
      </section>
    </main>
  </body>
</html>
